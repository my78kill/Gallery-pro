<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base for Android Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner ambient rim -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Gallery Aperture / Prism Petals -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Leaf 1 -->
    <path d="M 0 -140 C 60 -140 120 -80 120 -20 C 120 40 40 40 0 0 Z" fill="url(#prim)" opacity="0.95"/>
    <!-- Leaf 2 -->
    <path d="M 0 -140 C 60 -140 120 -80 120 -20 C 120 40 40 40 0 0 Z" fill="url(#sec)" opacity="0.9" transform="rotate(90)"/>
    <!-- Leaf 3 -->
    <path d="M 0 -140 C 60 -140 120 -80 120 -20 C 120 40 40 40 0 0 Z" fill="url(#acc)" opacity="0.9" transform="rotate(180)"/>
    <!-- Leaf 4 -->
    <path d="M 0 -140 C 60 -140 120 -80 120 -20 C 120 40 40 40 0 0 Z" fill="#10b981" opacity="0.9" transform="rotate(270)"/>
    
    <!-- Central Lens Circle -->
    <circle r="36" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    <circle r="20" fill="#38bdf8"/>
    <circle cx="6" cy="-6" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
